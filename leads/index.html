<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Evoluze — Leads</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  :root{ --primary:#0d9488; --primary-d:#0f766e; --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--primary-d)}
  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(2,6,23,.08);padding:2rem;width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.25rem;margin-bottom:.25rem}
  .brand .dot{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 1.25rem}
  label{display:block;font-size:.85rem;font-weight:600;margin:.75rem 0 .35rem}
  input,select{width:100%;padding:.7rem .8rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem;outline:none}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  .btn{width:100%;margin-top:1.1rem;padding:.8rem;background:var(--primary);color:#fff;border:0;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--primary-d)}
  .btn[disabled]{opacity:.6;cursor:default}
  .err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:.6rem .75rem;font-size:.88rem;margin-top:1rem;display:none}
  /* ---------- Dashboard ---------- */
  .app{display:none;min-height:100vh}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:.9rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header .count{background:var(--primary);color:#fff;font-weight:700;font-size:.8rem;padding:.2rem .6rem;border-radius:999px}
  header .spacer{flex:1}
  .tbtn{border:1px solid var(--line);background:#fff;color:var(--text);padding:.5rem .8rem;border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer}
  .tbtn:hover{background:#f8fafc}
  .tbtn.ghost{color:var(--muted)}
  .toolbar{padding:1rem 1.25rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .toolbar input{max-width:320px}
  main{padding:0 1.25rem 3rem}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:820px}
  th,td{text-align:left;padding:.75rem .9rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f8fafc;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0}
  tr:hover td{background:#f8fafc}
  td.obj{max-width:320px;color:var(--muted)}
  .wa{display:inline-flex;align-items:center;gap:.3rem;color:#059669;font-weight:600;text-decoration:none;white-space:nowrap}
  .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
  .foot{color:var(--muted);font-size:.8rem;text-align:center;padding:1.5rem}
  @media(max-width:640px){ header{padding:.75rem} .toolbar{padding:.75rem} main{padding:0 .75rem 2rem} }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand"><span class="dot">E</span> Evoluze · Leads</div>
    <p class="sub">Painel privado. Acesso restrito.</p>
    <label for="u">Usuário</label>
    <input id="u" type="text" autocomplete="username" required>
    <label for="p">Senha</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">Entrar</button>
    <div class="err" id="loginErr">Usuário ou senha inválidos.</div>
  </form>
</div>

<!-- DASHBOARD -->
<div class="app" id="app">
  <header>
    <div class="brand"><span class="dot">E</span> Leads</div>
    <span class="count" id="count">0</span>
    <div class="spacer"></div>
    <button class="tbtn" id="refresh">↻ Atualizar</button>
    <button class="tbtn" id="csv">⬇ Exportar CSV</button>
    <button class="tbtn ghost" id="logout">Sair</button>
  </header>
  <div class="toolbar">
    <input id="search" type="text" placeholder="Buscar por nome, empresa, e-mail, telefone...">
  </div>
  <main>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Data</th><th>Nome</th><th>Empresa</th><th>WhatsApp</th><th>E-mail</th><th>Segmento</th><th>Objetivo</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">Nenhum lead ainda.</div>
    </div>
    <div class="foot">Evoluze Marketing · painel de leads</div>
  </main>
</div>

<script>
(function(){
  var FN='https://gmycqvvvglexbtbqkjzi.supabase.co/functions/v1/evoluze-list-leads';
  var KEY='sb_publishable_N4DdqinjzjnMBWsik5qj2A_ksPBX9Av';
  var loginEl=document.getElementById('login'), appEl=document.getElementById('app');
  var allLeads=[];

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return iso||''; } }
  function waLink(phone){ var d=(phone||'').replace(/\D/g,''); if(!d) return null; if(d.length<=11) d='55'+d; return 'https://wa.me/'+d; }

  function render(list){
    var rows=document.getElementById('rows'), empty=document.getElementById('empty');
    document.getElementById('count').textContent=list.length;
    if(!list.length){ rows.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    rows.innerHTML=list.map(function(l){
      var wl=waLink(l.whatsapp);
      var wa=wl?('<a class="wa" href="'+wl+'" target="_blank" rel="noopener">'+esc(l.whatsapp)+'</a>'):esc(l.whatsapp);
      var em=l.email?('<a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>'):'';
      return '<tr>'
        +'<td style="white-space:nowrap">'+esc(fmtDate(l.created_at))+'</td>'
        +'<td><strong>'+esc(l.nome)+'</strong></td>'
        +'<td>'+esc(l.empresa)+'</td>'
        +'<td>'+wa+'</td>'
        +'<td>'+em+'</td>'
        +'<td>'+esc(l.segmento)+'</td>'
        +'<td class="obj">'+esc(l.objetivo)+'</td>'
        +'</tr>';
    }).join('');
  }

  function applySearch(){
    var q=(document.getElementById('search').value||'').toLowerCase().trim();
    if(!q){ render(allLeads); return; }
    render(allLeads.filter(function(l){
      return [l.nome,l.empresa,l.email,l.whatsapp,l.segmento,l.objetivo].join(' ').toLowerCase().indexOf(q)>-1;
    }));
  }

  function toCSV(){
    var head=['Data','Nome','Empresa','WhatsApp','Email','Segmento','Objetivo'];
    var lines=[head.join(';')].concat(allLeads.map(function(l){
      return [fmtDate(l.created_at),l.nome,l.empresa,l.whatsapp,l.email,l.segmento,l.objetivo]
        .map(function(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }).join(';');
    }));
    var blob=new Blob(["﻿"+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='leads-evoluze-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  }

  function fetchLeads(user,pass,onErr){
    return fetch(FN,{ method:'POST', headers:{'Content-Type':'application/json','apikey':KEY},
      body:JSON.stringify({user:user,pass:pass}) })
      .then(function(r){ if(r.status===401) throw new Error('unauthorized'); return r.json(); })
      .then(function(j){ if(!j.ok) throw new Error('fail'); allLeads=j.leads||[]; return allLeads; });
  }

  function showApp(){ loginEl.style.display='none'; appEl.style.display='block'; applySearch(); }

  // login
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var u=document.getElementById('u').value, p=document.getElementById('p').value;
    var btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
    err.style.display='none'; btn.disabled=true; btn.textContent='Entrando...';
    fetchLeads(u,p).then(function(){
      try{ sessionStorage.setItem('ev_u',u); sessionStorage.setItem('ev_p',p); }catch(_){}
      showApp();
    }).catch(function(){
      err.style.display='block';
    }).finally(function(){ btn.disabled=false; btn.textContent='Entrar'; });
  });

  document.getElementById('refresh').addEventListener('click', function(){
    var u=sessionStorage.getItem('ev_u'), p=sessionStorage.getItem('ev_p');
    fetchLeads(u,p).then(applySearch).catch(function(){});
  });
  document.getElementById('search').addEventListener('input', applySearch);
  document.getElementById('csv').addEventListener('click', toCSV);
  document.getElementById('logout').addEventListener('click', function(){
    try{ sessionStorage.removeItem('ev_u'); sessionStorage.removeItem('ev_p'); }catch(_){}
    allLeads=[]; appEl.style.display='none'; loginEl.style.display='flex';
    document.getElementById('p').value='';
  });

  // auto-login se já logou nesta aba
  try{
    var su=sessionStorage.getItem('ev_u'), sp=sessionStorage.getItem('ev_p');
    if(su&&sp){ fetchLeads(su,sp).then(showApp).catch(function(){}); }
  }catch(_){}
})();
</script>
</body>
</html>
